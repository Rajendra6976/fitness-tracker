<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise Reminder - Fitness Tracker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">🏋️‍♂️</span>
      <span class="sidebar-title">Fitness Tracker</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/home.html">Home</a>
      <a href="/progress.html">Progress</a>
      <a href="/reports.html">Reports</a>
      <a href="/gym-guide.html">Gym Guide</a>
      <a href="/reminder.html" class="active">Reminder</a>
      <a href="/about.html">About</a>
      <a href="/help.html">Help</a>
  <a href="/settings.html">Settings</a>
  <a href="/chatbot.html">Chatbot</a>
    </nav>
    <div class="sidebar-user">
      <div class="user-avatar">👤</div>
      <div class="user-name">raj</div>
      <a href="/logout.html" class="logout-btn">Logout</a>
    </div>
  </div>
  <main class="main-content">
    <div style="display:flex;justify-content:flex-end;align-items:center;margin-bottom:12px;">
      <input id="settings-bot-input" type="text" placeholder="Search or ask... (e.g. 'open reminder', 'logout')" style="padding:10px 14px;font-size:1rem;border-radius:8px;border:1.5px solid #b7e4c7;width:220px;">
      <button onclick="window.openSetting(document.getElementById('settings-bot-input').value)" style="padding:10px 18px;font-size:1rem;border-radius:8px;background:linear-gradient(90deg,#43cea2 0%,#185a9d 100%);color:#fff;font-weight:700;border:none;cursor:pointer;margin-left:8px;">Search</button>
    </div>
    <h1 class="dashboard-title">Exercise Reminder</h1>
    <div class="chart-section" style="max-width:600px;margin-bottom:32px;">
      <form id="reminder-form" style="display:flex;flex-direction:column;gap:18px;">
        <label for="reminder-text" style="font-size:1.1rem;font-weight:600;">Your Daily Exercise Reminder:</label>
        <input type="text" id="reminder-text" value="Aim to exercise at least 30 minutes every day for your health!" style="padding:14px 12px;font-size:1.1rem;border-radius:8px;border:1.5px solid #b7e4c7;background:#f1faee;">
        <button type="submit" style="padding:14px 0;font-size:1.15rem;border-radius:8px;background:linear-gradient(90deg,#43cea2 0%,#185a9d 100%);color:#fff;font-weight:700;border:none;">Save Reminder</button>
      </form>
      <div id="reminder-preview" style="margin-top:24px;font-size:1.15rem;font-weight:600;color:#2a5298;"></div>
    </div>
  </main>
  <footer class="footer-bar">
    <span>© 2025 Fitness Tracker. All rights reserved.</span>
  </footer>
  <script src="/settings-bot.js"></script>
  <script>
    // Load and save reminder using localStorage
    const form = document.getElementById('reminder-form');
    const input = document.getElementById('reminder-text');
    const preview = document.getElementById('reminder-preview');
    function loadReminder() {
      const saved = localStorage.getItem('exerciseReminder');
      if (saved) input.value = saved;
      preview.textContent = input.value;
    }
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      localStorage.setItem('exerciseReminder', input.value);
      preview.textContent = input.value;
    });
    input.addEventListener('input', function() {
      preview.textContent = input.value;
    });
    loadReminder();
  </script>
</body>
</html>
