<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fitness Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-hero">
    <div class="auth-shell">
        <div class="auth-left">
            <span class="brand-badge">💪 Fitness Tracker</span>
            <h2>Welcome Back!</h2>
            <p>Sign in to your personal fitness dashboard and keep your progress on track.</p>
        </div>
        <div class="auth-right">
            <h2 style="margin-top:0;">Login</h2>
            <form id="login-form" class="auth-form">
                <input class="auth-input" type="text" id="login-username" placeholder="Username" required>
                <input class="auth-input" type="password" id="login-password" placeholder="Password" required>
                <button class="auth-btn" type="submit">Login</button>
            </form>
            <div class="auth-links">Don't have an account? <a href="signup.html">Sign up</a></div>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
