<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Fitness Tracker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo">🏋️‍♂️</span>
      <span class="sidebar-title">Fitness Tracker</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/home.html" class="active">Home</a>
      <a href="/progress.html">Progress</a>
      <a href="/reports.html">Reports</a>
      <a href="./gym-guide.html">gym guide</a>
      <a href="./reminder.html" class="active">Remainder</a>
      <a href="/about.html">About</a>
      <a href="/help.html">Help</a>
  <a href="/settings.html">Settings</a>
  <a href="/chatbot.html">Chatbot</a>
  <a href="./signup.html">logout</a>
    </nav>
    <div class="sidebar-user">
  <div class="user-avatar">👤</div>
  <div class="user-name" id="sidebar-username">raj</div>
      <a href="#" onclick="logoutUser(); return false;" class="logout-btn">Logout</a>
    </div>
  </div>
  <main class="main-content">
  <div style="display:flex;justify-content:flex-end;align-items:center;margin-bottom:12px;">
    <input id="settings-bot-input" type="text" placeholder="Search or ask... (e.g. 'open reminder', 'logout')" style="padding:10px 14px;font-size:1rem;border-radius:8px;border:1.5px solid #b7e4c7;width:220px;">
    <button onclick="window.openSetting(document.getElementById('settings-bot-input').value)" style="padding:10px 18px;font-size:1rem;border-radius:8px;background:linear-gradient(90deg,#43cea2 0%,#185a9d 100%);color:#fff;font-weight:700;border:none;cursor:pointer;margin-left:8px;">Search</button>
  </div>
  <div id="exercise-reminder-bar" style="background:linear-gradient(90deg,#43cea2 0%,#185a9d 100%);color:#fff;padding:14px 24px;border-radius:10px;margin-bottom:24px;font-size:1.15rem;font-weight:600;max-width:600px;box-shadow:0 2px 8px rgba(30,60,114,0.10);"></div>
  <div style="display:flex;flex-direction:column;align-items:center;">
    <h1 class="dashboard-title" style="text-align:center;margin:0 0 12px 0;">Home</h1>
    <section class="panel" style="max-width:600px;width:100%;margin:10px 0 0 0;box-shadow:0 8px 32px rgba(30,60,114,0.15);padding:36px 40px 32px 40px;">
      <h2 style="color:#2a5298;font-size:2rem;text-align:center;margin-bottom:32px;">Assign a Task</h2>
      <form id="workout-form" style="display:flex;flex-direction:column;gap:18px;align-items:stretch;">
        <select id="type" required style="padding:14px 12px;font-size:1.1rem;border-radius:8px;border:1.5px solid #b7e4c7;background:#f1faee;">
          <option value="">Select Type</option>
          <option value="Running">Running</option>
          <option value="Cycling">Cycling</option>
          <option value="Swimming">Swimming</option>
          <option value="Yoga">Yoga</option>
          <option value="Gym">Gym</option>
        </select>
  <input type="number" id="duration" placeholder="Duration (min)" required min="1" style="padding:14px 12px;font-size:1.1rem;border-radius:8px;border:1.5px solid #b7e4c7;background:#f1faee;">
  <input type="number" id="calories" placeholder="Calories Burned (auto)" required min="1" style="padding:14px 12px;font-size:1.1rem;border-radius:8px;border:1.5px solid #b7e4c7;background:#f1faee;" readonly>
  <script>
    // Auto-calculate calories based on duration and type
    const durationInput = document.getElementById('duration');
    const typeInput = document.getElementById('type');
    const caloriesInput = document.getElementById('calories');
    // Example calories per minute for each type
    const caloriesPerMin = {
      Running: 10,
      Cycling: 8,
      Swimming: 11,
      Yoga: 4,
      Gym: 7
    };
    function updateCalories() {
      const type = typeInput.value;
      const duration = Number(durationInput.value);
      if (type && duration > 0 && caloriesPerMin[type]) {
        caloriesInput.value = Math.round(duration * caloriesPerMin[type]);
      } else {
        caloriesInput.value = '';
      }
    }
    durationInput.addEventListener('input', updateCalories);
    typeInput.addEventListener('change', updateCalories);
  </script>
        <input type="date" id="date" required style="padding:14px 12px;font-size:1.1rem;border-radius:8px;border:1.5px solid #b7e4c7;background:#f1faee;">
        <button type="submit" style="padding:14px 0;font-size:1.15rem;border-radius:8px;background:linear-gradient(90deg,#43cea2 0%,#185a9d 100%);color:#fff;font-weight:700;border:none;">Assign Task</button>
      </form>
    </section>
  </div>


    <div class="dashboard-trends">
      <div class="chart-title">Recent Workouts</div>
      <ul class="workout-list" id="recentWorkouts"></ul>
    </div>
  </main>
  <footer class="footer-bar">
    <span>© 2025 Fitness Tracker. All rights reserved.</span>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="/app.js"></script>
  <script src="/logout.js"></script>
  <script src="/reminder-bar.js"></script>
  <script src="/settings-bot.js"></script>
  <script>
    // Display logged-in username from localStorage
    document.addEventListener('DOMContentLoaded', function() {
      var username = localStorage.getItem('fitnessUsername');
      if (username) {
        var el = document.getElementById('sidebar-username');
        if (el) el.textContent = username;
      }
    });
  </script>
  <script>
    // Example: Fetch and display workout stats and charts
    const API_URL = 'http://localhost:3000/api/workouts';
    fetch(API_URL).then(r=>r.json()).then(workouts => {



      // Workouts by Type
      const typeTotals = workouts.reduce((a,w)=>{const k=w.type||'Other';a[k]=(a[k]||0)+1;return a;},{});
      const typeLabels = Object.keys(typeTotals);
      const typeData = typeLabels.map(l=>typeTotals[l]);
      new Chart(document.getElementById('workoutTypeChart').getContext('2d'), {type:'doughnut', data:{labels:typeLabels, datasets:[{data:typeData, backgroundColor:['#43cea2','#185a9d','#f09819','#ff5858','#56ab2f','#a8e063']}]}, options:{plugins:{title:{display:true,text:'Workouts by Type'}}}});

      // Calories Burned by Day
      const dayTotals = workouts.reduce((a,w)=>{const d=new Date((w.date||'')+'T00:00:00');const k=isNaN(d)?'':d.toLocaleDateString(undefined,{weekday:'short'});a[k]=(a[k]||0)+(Number(w.calories)||0);return a;},{});
      const dayLabels = Object.keys(dayTotals);
      const dayData = dayLabels.map(l=>dayTotals[l]);
      new Chart(document.getElementById('caloriesDayChart').getContext('2d'), {type:'bar', data:{labels:dayLabels, datasets:[{label:'Calories', data:dayData, backgroundColor:'#43cea2'}]}, options:{plugins:{title:{display:true,text:'Calories Burned by Day'}}, scales:{y:{beginAtZero:true}}}});

      // Recent Workouts
      const recent = workouts.slice(-5).reverse();
      const recentList = document.getElementById('recentWorkouts');
      recentList.innerHTML = recent.map(w => `<li class="workout-item">${w.type} - ${w.duration} min - ${w.calories} cal (${w.date})</li>`).join('');
    });
  </script>
</body>
</html>
