<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Fitness Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-hero">
    <div class="auth-shell">
        <div class="auth-left">
            <span class="brand-badge">💪 Fitness Tracker</span>
            <h2>Join Us!</h2>
            <p>Create your account to start logging workouts and visualizing your progress.</p>
        </div>
        <div class="auth-right">
            <h2 style="margin-top:0;">Sign Up</h2>
            <form id="signup-form" class="auth-form">
                <input class="auth-input" type="text" id="signup-username" placeholder="Username" required>
                <input class="auth-input" type="password" id="signup-password" placeholder="Password" required>
                <button class="auth-btn" type="submit">Create Account</button>
            </form>
            <div class="auth-links">Already have an account? <a href="login.html">Login</a></div>
        </div>
    </div>
    <script src="signup.js"></script>
</body>
</html>
