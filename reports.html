<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Fitness Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-logo" style="font-size:3.5rem;">🏋️‍♂️</span>
            <span class="sidebar-title">Fitness Tracker</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/home.html">Home</a>
            <a href="/progress.html">Progress</a>
            <a href="/reports.html" class="active">Reports</a>
            <a href="./gym-guide.html">gym guide</a>
            <a href="./reminder.html" class="active">Remainder</a>
            <a href="/about.html">About</a>
            <a href="/help.html">Help</a>
            <a href="/settings.html">Settings</a>
            <a href="/chatbot.html">Chatbot</a>
        </nav>
        <div class="sidebar-user">
            <div class="user-avatar" style="font-size:2.5rem;">👤</div>
            <div class="user-name">raj</div>
            <a href="#" onclick="logoutUser(); return false;" class="logout-btn">Logout</a>
        </div>
    </div>
    <main class="main-content">
        <div style="display:flex;justify-content:flex-end;align-items:center;margin-bottom:12px;">
          <input id="settings-bot-input" type="text" placeholder="Search or ask... (e.g. 'open reminder', 'logout')" style="padding:10px 14px;font-size:1rem;border-radius:8px;border:1.5px solid #b7e4c7;width:220px;">
          <button onclick="window.openSetting(document.getElementById('settings-bot-input').value)" style="padding:10px 18px;font-size:1rem;border-radius:8px;background:linear-gradient(90deg,#43cea2 0%,#185a9d 100%);color:#fff;font-weight:700;border:none;cursor:pointer;margin-left:8px;">Search</button>
        </div>
        <div id="exercise-reminder-bar" style="background:linear-gradient(90deg,#43cea2 0%,#185a9d 100%);color:#fff;padding:14px 24px;border-radius:10px;margin-bottom:24px;font-size:1.15rem;font-weight:600;max-width:600px;box-shadow:0 2px 8px rgba(30,60,114,0.10);"></div>
                <h1 class="dashboard-title">Reports</h1>
                <div class="dashboard-charts" style="flex-direction: column; gap: 32px;">
            <div class="chart-section" style="background:#23272f; box-shadow:0 4px 24px rgba(0,0,0,0.18); border-radius:20px;">
                <div class="chart-title" style="color:#baff7a; font-size:1.5rem;">Workout Reports</div>
                <div class="report-table" style="background:#181c23; border-radius:16px; box-shadow:0 2px 8px rgba(44,62,80,0.10);">
                    <table style="width:100%; border-collapse:collapse; background:#23272f; color:#e0ffe0; font-size:1.15rem;">
                        <thead>
                            <tr style="background:#23272f; color:#baff7a;">
                                <th>ID</th>
                                <th>Type</th>
                                <th>Duration (min)</th>
                                <th>Calories</th>
                                <th>Calories/min</th>
                                <th>Date</th>
                                <th>Day</th>
                                <th>Completed</th>
                            </tr>
                        </thead>
                        <tbody id="report-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer-bar">
        <span>© 2025 Fitness Tracker. All rights reserved.</span>
    </footer>
    <script>
        const API_URL = 'http://localhost:3000/api/workouts';
        const tbody = document.getElementById('report-body');
        fetch(API_URL).then(r=>r.json()).then(workouts => {
            tbody.innerHTML = '';
            workouts.forEach(w => {
                const tr = document.createElement('tr');
                const d = Number(w.duration)||0; const c = Number(w.calories)||0;
                const calPerMin = d>0 ? (c/d).toFixed(2) : '0.00';
                const day = w.date ? new Date(w.date+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'}) : '';
                tr.innerHTML = `
                    <td style='color:#baff7a;'>${w.id??''}</td>
                    <td>${w.type}</td>
                    <td>${d}</td>
                    <td>${c}</td>
                    <td>${calPerMin}</td>
                    <td>${w.date??''}</td>
                    <td>${day}</td>
                    <td>${w.completed ? '<span style="color:#56ab2f; font-size:1.5rem;">✅</span>' : ''}</td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
    <script src="/reminder-bar.js"></script>
    <script src="/settings-bot.js"></script>
    <script src="/logout.js"></script>
</body>
</html>
